<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nathen's Wishlist</title>
<meta name="description" content="Nathen's Christmas wishlist with a photo, sizes and colors, and a store link for every item.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Figtree:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one festive night-sky page. String of lights up top, Elf title slide hero, then one section per original slide,
   each with its meme as a sticker. Cards are cream gift tags on dark evergreen. Deliberately single-theme (dark). */
:root {
  --night: #0c2a20;         /* evergreen night */
  --night-2: #123a2c;
  --snow: #fffaf1;           /* card cream */
  --ink: #221b16;
  --muted: #6d6157;
  --red: #c4162f;            /* santa red */
  --red-deep: #8f0e22;
  --gold: #f1c45a;
  --gold-ink: #4a3405;
  --pine: #1f6b4e;
  --on-night: #f4efe4;
  --on-night-muted: #b9c9bf;
  --display: "Mountains of Christmas", "Georgia", serif;
  --body: "Figtree", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0; min-height: 100vh; color: var(--on-night); font: 400 15px/1.5 var(--body);
  background:
    radial-gradient(1200px 600px at 80% -10%, #1d5a43 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 30%, #17402f 0%, transparent 60%),
    var(--night);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow-x: hidden;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 1180px; margin: 0 auto; position: relative; z-index: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Snow sits behind everything */
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* String of lights */
.lights { position: relative; z-index: 2; height: 44px; overflow: hidden; display: flex; justify-content: space-around; padding-inline: 8px; }
.lights::before { content: ""; position: absolute; left: -2%; right: -2%; top: -30px; height: 50px; border-bottom: 2px solid #2b2b2b; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
.bulb { width: 12px; height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; margin-top: 14px; position: relative; animation: twinkle 1.6s ease-in-out infinite; }
.bulb::before { content: ""; position: absolute; top: -5px; left: 3px; width: 6px; height: 6px; background: #333; border-radius: 2px; }
.bulb:nth-child(4n+1) { background: var(--red);  box-shadow: 0 0 14px 3px rgb(255 40 70 / .7); }
.bulb:nth-child(4n+2) { background: var(--gold); box-shadow: 0 0 14px 3px rgb(255 210 90 / .7); animation-delay: .4s; }
.bulb:nth-child(4n+3) { background: #39c27f;     box-shadow: 0 0 14px 3px rgb(60 220 140 / .7); animation-delay: .8s; }
.bulb:nth-child(4n+4) { background: #4aa8ff;     box-shadow: 0 0 14px 3px rgb(80 170 255 / .7); animation-delay: 1.2s; }
@keyframes twinkle { 50% { opacity: .35; filter: saturate(.4); } }

/* Hero */
header.top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 24px 28px; }
.slide {
  all: unset; cursor: pointer; display: block; position: relative; border-radius: 10px; overflow: hidden;
  border: 8px solid var(--snow); box-shadow: 0 20px 50px rgb(0 0 0 / .45); rotate: -2.5deg; max-width: 100%;
  animation: dramatic 1.4s cubic-bezier(.2, 1.4, .4, 1) both;
}
.slide img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
@keyframes dramatic {
  0% { transform: scale(3.2) rotate(-25deg); opacity: 0; }
  55% { transform: scale(.92) rotate(4deg); opacity: 1; }
  75% { transform: scale(1.04) rotate(-1deg); }
  100% { transform: none; }
}
.hero-copy { display: grid; gap: 14px; min-width: 0; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
h1 {
  font: 700 clamp(46px, 8vw, 88px)/.95 var(--display); margin: 0; color: var(--snow); cursor: pointer;
  text-shadow: 0 3px 0 var(--red-deep), 0 8px 24px rgb(0 0 0 / .4); text-wrap: balance; display: inline-block; justify-self: start;
}
.subtitle { font: 500 15px/1.3 var(--body); color: var(--on-night-muted); margin: 0; }
.subtitle s { color: #7f958a; }
.lede { margin: 0; max-width: 52ch; color: var(--on-night); }
.lede b { color: var(--gold); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chaos {
  border: 2px solid var(--gold); background: transparent; color: var(--gold); border-radius: 999px;
  font: 800 13px/1 var(--body); padding: 10px 14px; cursor: pointer; letter-spacing: .02em;
}
.chaos[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
@media (max-width: 760px) { header.top { grid-template-columns: 1fr; gap: 22px; } }

/* Filter bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: rgb(12 42 32 / .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-block: 12px; border-bottom: 1px solid rgb(255 255 255 / .1);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1 1 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 1px solid rgb(255 255 255 / .18); background: rgb(255 255 255 / .06); color: var(--on-night);
  font: 600 14px/1 var(--body); padding: 9px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  transition: transform .15s;
}
.tab:hover { transform: translateY(-2px) rotate(-2deg); }
.tab .n { font: 500 11px/1 var(--mono); opacity: .7; }
.tab[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.search { flex: 0 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: 500 14px/1 var(--body); color: var(--on-night); background: rgb(255 255 255 / .08);
  border: 1px solid rgb(255 255 255 / .18); border-radius: 999px; padding: 10px 14px 10px 34px;
}
.search input::placeholder { color: var(--on-night-muted); }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--on-night-muted); }
@media (max-width: 560px) { .search { flex: 1 1 100%; } }

/* Sections */
main { padding-block: 12px 64px; display: grid; gap: 52px; }
section.cat { display: grid; gap: 18px; padding-top: 18px; }
.cat-head { display: flex; align-items: center; gap: 16px; min-height: 96px; }
.cat-head .titles { display: grid; gap: 4px; min-width: 0; flex: 1; }
.cat-head h2 { font: 700 clamp(36px, 5vw, 52px)/1 var(--display); margin: 0; color: var(--gold); text-shadow: 0 2px 0 rgb(0 0 0 / .35); }
.cat-head .count { font: 500 12px/1 var(--mono); color: var(--on-night-muted); letter-spacing: .06em; text-transform: uppercase; }
.sticker {
  all: unset; cursor: pointer; flex: none; width: 112px; aspect-ratio: 1; background: #fff; padding: 6px 6px 18px;
  box-shadow: 0 10px 24px rgb(0 0 0 / .45); rotate: var(--rot, 6deg); animation: bob 3.2s ease-in-out infinite;
  transition: scale .2s;
}
.sticker img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sticker:hover { scale: 1.12; }
@keyframes bob { 50% { translate: 0 -6px; rotate: calc(var(--rot, 6deg) * -1); } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 18px; }

/* Card = gift tag */
.card {
  background: var(--snow); color: var(--ink); border-radius: var(--r); box-shadow: 0 10px 30px rgb(0 0 0 / .35);
  display: flex; flex-direction: column; overflow: hidden; min-width: 0; position: relative;
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.card::before { /* ribbon across the top */
  content: ""; height: 8px; background: repeating-linear-gradient(-45deg, var(--red) 0 10px, #fff 10px 20px);
}
.card:hover { transform: scale(1.05) rotate(var(--tilt, 1.5deg)); z-index: 2; }
.shot { all: unset; cursor: zoom-in; display: block; aspect-ratio: 1 / 1; max-width: 100%; background: #fff; position: relative; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: contain; padding: 10px; display: block; transition: transform .35s ease; }
.shot:hover img { transform: scale(1.18) rotate(-3deg); }
.badge {
  position: absolute; top: 10px; left: 10px; font: 800 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase;
  padding: 7px 9px; border-radius: 6px; background: var(--gold); color: var(--gold-ink); animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { scale: 1.12; rotate: -4deg; } }
.body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.store { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.name { font: 800 16px/1.3 var(--body); margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--mono); background: #fbefc8; color: #5a4610; padding: 6px 8px 6px 16px; border-radius: 5px; position: relative; }
.chip::before { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 4px; border-radius: 50%; translate: 0 -50%; background: var(--snow); }
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
.actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font: 800 14px/1 var(--body);
  padding: 11px 14px; border-radius: 10px; background: var(--red); color: #fff; transition: transform .15s;
}
.btn:hover { transform: scale(1.06) rotate(-2deg); background: var(--red-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--red); }
.btn.off { background: transparent; color: var(--muted); border: 2px dashed #d9cfc0; cursor: default; transform: none; }

/* Pick-one group */
.group {
  grid-column: span 2; background: var(--snow); color: var(--ink); border-radius: var(--r); box-shadow: 0 10px 30px rgb(0 0 0 / .35);
  display: flex; flex-direction: column; overflow: hidden; min-width: 0;
}
.group-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--gold); color: var(--gold-ink); font: 800 14px/1.3 var(--body); flex-wrap: wrap; }
.group-head .pick { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: var(--red); color: #fff; padding: 5px 7px; border-radius: 5px; }
.group-opts { display: grid; grid-template-columns: 1fr auto 1fr; flex: 1; }
.group-opts .card { box-shadow: none; border-radius: 0; }
.group-opts .card::before { display: none; }
.or { display: grid; place-items: center; font: 700 22px/1 var(--display); color: var(--red); background: linear-gradient(#e4d9c8, #e4d9c8) center / 2px 100% no-repeat; width: 40px; }
.or span { background: var(--snow); padding: 6px 0; }
@media (max-width: 620px) {
  .group { grid-column: 1 / -1; }
  .group-opts { grid-template-columns: 1fr; }
  .or { width: auto; height: 34px; background-size: 100% 2px; }
  .or span { padding: 0 10px; }
}

/* Placeholders */
.ph { width: 100%; height: 100%; display: grid; place-items: center; align-content: center; gap: 10px; color: #8a7d70; padding: 20px; text-align: center; }
.ph svg { width: 64px; height: 64px; }
.ph small { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.giftcard {
  width: 78%; aspect-ratio: 1.586; border-radius: 12px; padding: 14px; color: #fff;
  background: linear-gradient(135deg, #1d3c8f, #2a64c9 55%, #d7a531); display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 10px 24px rgb(20 40 90 / .3); text-align: left;
}
.giftcard b { font: 800 22px/1 var(--body); font-style: italic; letter-spacing: .02em; align-self: flex-end; }
.giftcard span { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .9; }

.empty { color: var(--on-night-muted); padding: 40px 0; text-align: center; }
footer { color: var(--on-night-muted); font-size: 13px; padding-block: 18px 40px; border-top: 1px solid rgb(255 255 255 / .1); }

/* Chaos animations (applied at random by script) */
.fx-spin   { animation: fx-spin .9s cubic-bezier(.5, -0.3, .4, 1.3); }
.fx-flip   { animation: fx-flip 1s ease-in-out; }
.fx-zoom   { animation: fx-zoom .9s cubic-bezier(.2, 1.6, .4, 1); }
.fx-wiggle { animation: fx-wiggle .7s ease-in-out; }
.fx-barrel { animation: fx-barrel 1.1s ease-in-out; }
@keyframes fx-spin   { to { transform: rotate(360deg); } }
@keyframes fx-flip   { 50% { transform: perspective(700px) rotateY(180deg) scale(1.05); } 100% { transform: perspective(700px) rotateY(360deg); } }
@keyframes fx-zoom   { 0% { transform: scale(1); } 35% { transform: scale(1.35) rotate(-4deg); } 100% { transform: scale(1); } }
@keyframes fx-wiggle { 20% { transform: rotate(-7deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
@keyframes fx-barrel { 0% { transform: none; } 50% { transform: translateY(-40px) rotate(180deg) scale(.8); } 100% { transform: rotate(360deg); } }

/* Meme fly-by */
.flyby {
  position: fixed; z-index: 20; width: 140px; pointer-events: none; background: #fff; padding: 5px 5px 16px; box-shadow: 0 10px 30px rgb(0 0 0 / .5);
  bottom: calc(40px + env(safe-area-inset-bottom, 0px)); left: -180px; animation: flyby 4.5s linear forwards;
}
.flyby img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
@keyframes flyby {
  0% { transform: translateX(0) rotate(0); }
  50% { transform: translateX(calc(50vw + 90px)) translateY(-120px) rotate(540deg); }
  100% { transform: translateX(calc(100vw + 360px)) rotate(1080deg); }
}

/* Dramatic meme zoom overlay */
#zoomer { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(0 0 0 / .75); cursor: pointer; padding: 24px; }
#zoomer figure { margin: 0; display: grid; gap: 14px; justify-items: center; animation: slam .7s cubic-bezier(.2, 1.5, .4, 1) both; }
#zoomer img { max-width: min(560px, 86vw); max-height: 62vh; border: 10px solid #fff; box-shadow: 0 30px 80px rgb(0 0 0 / .6); animation: shake .5s .7s 2; }
#zoomer figcaption { font: 700 clamp(28px, 6vw, 48px)/1.05 var(--display); color: var(--gold); text-align: center; text-shadow: 0 3px 0 var(--red-deep); text-wrap: balance; }
@keyframes slam { 0% { transform: scale(.1) rotate(-540deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes shake { 25% { translate: -8px 4px; } 50% { translate: 6px -6px; } 75% { translate: -4px 2px; } }

/* Lightbox */
dialog#lb {
  border: 0; padding: 0; border-radius: 18px; background: var(--snow); color: var(--ink);
  width: min(920px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: 0 30px 80px rgb(0 0 0 / .6);
}
dialog#lb[open] { animation: fx-zoom .5s cubic-bezier(.2, 1.6, .4, 1); }
dialog#lb::backdrop { background: rgb(5 20 14 / .7); backdrop-filter: blur(3px); }
.lb-in { display: grid; grid-template-columns: 1.2fr 1fr; max-height: inherit; }
.lb-photo { background: #fff; display: grid; place-items: center; min-height: 0; aspect-ratio: 1/1; max-width: 100%; }
.lb-photo img { width: 100%; height: 100%; object-fit: contain; padding: 20px; }
.lb-info { padding: 26px 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; min-width: 0; }
.lb-info .name { font: 800 24px/1.15 var(--body); }
.close { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--red); color: #fff; cursor: pointer; font-size: 20px; line-height: 1; z-index: 1; }
@media (max-width: 700px) { .lb-in { grid-template-columns: 1fr; overflow-y: auto; } .lb-photo { aspect-ratio: 4/3; } }

/* Calm mode: chaos off, or the viewer's OS asks for less motion */
body.calm .slide, body.calm .sticker, body.calm .badge, body.calm .bulb, body.calm #zoomer figure, body.calm #zoomer img { animation: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="lights" aria-hidden="true" id="lights"></div>

<div class="wrap">
  <header class="top">
    <button class="slide" id="titleSlide" aria-label="Zoom in on the title slide">
      <img src="images/memes/title.jpg" alt="The original title slide: Buddy the Elf and a cat wearing ornaments, with 'Click to add title' still on it">    </button>
    <div class="hero-copy">
      <div class="eyebrow">Christmas 2026 · <span id="total"></span> things</div>
      <h1 id="title">Nathen's Wishlist</h1>      <p class="lede">Tap any photo for a closer look. <b>Sizes and colors are on the yellow tags</b>, and every red button goes straight to the right product page. Where it says <b>Pick one</b>, either option is great.</p>
      <div class="controls">
        <button class="chaos" id="chaos" aria-pressed="true">Chaos mode: ON</button>
      </div>
    </div>
  </header>

  <nav class="bar" aria-label="Filter wishlist">
    <div class="tabs" id="tabs" role="toolbar"></div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search the list" aria-label="Search the list">
    </label>
  </nav>

  <main id="main"></main></div>

<div id="zoomer" hidden role="dialog" aria-label="Meme close-up"><figure><img id="zoomImg" alt=""><figcaption id="zoomCap"></figcaption></figure></div>

<dialog id="lb" aria-label="Item details">
  <button class="close" id="lbClose" aria-label="Close">×</button>
  <div class="lb-in">
    <div class="lb-photo" id="lbPhoto"></div>
    <div class="lb-info" id="lbInfo"></div>
  </div>
</dialog>

    links: [
      { label: "1/144 (HG & RG)", url: "https://www.gundamplanet.com/products/1-144-display-stand-action-base-5-clear" },
      { label: "1/100 (MG)", url: "https://www.gundamplanet.com/products/1-100-display-stand-action-base-4-clear" },
    ] },
];

const GROUPS = { monitor: "Monitor", keyboard: "Keyboard" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// count "things": a pick-one group counts once
const thingCount = items => new Set(items.map(i => i.group || i.id)).size;
$("#total").textContent = thingCount(ITEMS);
$("#lights").innerHTML = '<span class="bulb"></span>'.repeat(Math.max(10, Math.round(innerWidth / 48)));

function photo(item, big = false) {
  if (item.img) return `<img src="${item.img}" alt="${esc(item.name)}" loading="${big ? "eager" : "lazy"}">`;
  if (item.ph === "giftcard") return `<div class="ph"><div class="giftcard"><span>Gift card</span><b>VISA</b></div></div>`;
  return `<div class="ph"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M20 8h24l2 48H36l-4-30-4 30H18z"/><path d="M20 14h24"/></svg><small>Photo coming soon</small></div>`;
}

function details(item) {
  const tags = item.tags.length ? `<div class="chips">${item.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : "";
  const note = item.note ? `<p class="note">${esc(item.note)}</p>` : "";
  const links = item.links.map((l, i) => `<a class="btn${i ? " ghost" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} <span aria-hidden="true">↗</span></a>`).join("");
  return { tags, note, links: links ? `<div class="actions">${links}</div>` : "" };
}

function card(item) {
  const d = details(item);
  return `<article class="card" style="--tilt:${rand(-3, 3).toFixed(1)}deg">
    <button class="shot" data-open="${item.id}" aria-label="Enlarge photo of ${esc(item.name)}">
      ${photo(item)}${item.preferred ? `<span class="badge">★ Preferred</span>` : ""}
    </button>
    <div class="body">
      <div class="store">${esc(item.store)}</div>
      <h3 class="name">${esc(item.name)}</h3>
      ${d.tags}${d.note}${d.links}
    </div>
  </article>`;
}

function groupCard(key, items) {
  const pref = items.find(i => i.preferred);
  return `<div class="group">
    <div class="group-head"><span class="pick">Pick one</span>${esc(GROUPS[key])}${pref ? ` · I’d prefer the ${esc(pref.name.replace(/^Mercury /, ""))}` : ""}</div>
    <div class="group-opts">${items.map(card).join(`<div class="or" aria-hidden="true"><span>OR</span></div>`)}</div>
  </div>`;
}

let state = { cat: "all", q: "", chaos: true };
try {
  const s = localStorage.getItem("wl-cat"); if (s && (s === "all" || CATS.some(c => c.id === s))) state.cat = s;
  if (localStorage.getItem("wl-chaos") === "off") state.chaos = false;
} catch (e) {}
const hashCat = location.hash.slice(1);
if (CATS.some(c => c.id === hashCat)) state.cat = hashCat;

function matches(item) {
  if (!state.q) return true;
  const hay = [item.name, item.store, item.note, ...item.tags].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderTabs() {
  const all = [{ id: "all", label: "All" }, ...CATS];
  $("#tabs").innerHTML = all.map(c => {
    const n = thingCount(ITEMS.filter(i => c.id === "all" || i.cat === c.id));
    return `<button class="tab" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${c.label} <span class="n">${n}</span></button>`;
  }).join("");
}

function render() {
  const cats = CATS.filter(c => state.cat === "all" || c.id === state.cat);
  let html = "", shown = 0;
  for (const c of cats) {
    const items = ITEMS.filter(i => i.cat === c.id && matches(i));
    if (!items.length) continue;
    shown += items.length;
    const done = new Set(), parts = [];
    for (const it of items) {
      if (it.group) {
        if (done.has(it.group)) continue;
        done.add(it.group);
        parts.push(groupCard(it.group, items.filter(x => x.group === it.group)));
      } else parts.push(card(it));
    }
    const n = thingCount(items);
    html += `<section class="cat" id="sec-${c.id}">
      <div class="cat-head">
        <div class="titles"><h2>${c.label}</h2><span class="count">${esc(c.sub)} · ${n} ${n === 1 ? "thing" : "things"}</span></div>
        <button class="sticker" style="--rot:${c.rot}" data-meme="${c.meme}" data-cap="${esc(c.cap)}" aria-label="Zoom in on the ${esc(c.label)} meme"><img src="images/memes/${c.meme}.jpg" alt="" loading="lazy"></button>
      </div>
      <div class="grid">${parts.join("")}</div>
    </section>`;
  }
  $("#main").innerHTML = shown ? html : `<p class="empty">Nothing matches “${esc(state.q)}”. Try another word or clear the search.</p>`;
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat;
  try { localStorage.setItem("wl-cat", state.cat); } catch (err) {}
  renderTabs(); render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });

// Lightbox
const lb = $("#lb");
$("#main").addEventListener("click", e => {
  const meme = e.target.closest("[data-meme]");
  if (meme) { zoomMeme(meme.dataset.meme, meme.dataset.cap); return; }
  const b = e.target.closest("[data-open]"); if (!b) return;
  const item = byId[b.dataset.open], d = details(item);
  $("#lbPhoto").innerHTML = photo(item, true);
  $("#lbInfo").innerHTML = `<div class="store">${esc(item.store)}${item.preferred ? " · ★ Preferred" : ""}</div>
    <h3 class="name">${esc(item.name)}</h3>${d.tags}${d.note}${d.links}`;
  lb.showModal();
});
$("#lbClose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

// Dramatic meme zoom
const zoomer = $("#zoomer");
function zoomMeme(name, cap, src) {
  $("#zoomImg").src = src || `images/memes/${name}.jpg`;
  $("#zoomCap").textContent = cap;
  zoomer.hidden = false;
  const fig = zoomer.querySelector("figure");
  fig.style.animation = "none"; fig.offsetWidth; fig.style.animation = "";
}
zoomer.addEventListener("click", () => { zoomer.hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape") zoomer.hidden = true; });
$("#titleSlide").addEventListener("click", () => zoomMeme(null, "Click to add title", "images/memes/title.jpg"));

// Title does a spin when clicked
$("#title").addEventListener("click", e => fx(e.currentTarget, "fx-barrel"));

function fx(el, cls) {
  if (!el || reduced) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  el.addEventListener("animationend", () => el.classList.remove(cls), { once: true });
}

// Chaos mode: random spins, flips and zooms on cards; memes flying past now and then
const FX = ["fx-spin", "fx-flip", "fx-zoom", "fx-wiggle", "fx-barrel", "fx-zoom", "fx-wiggle"];
function visibleCards() {
  return [...document.querySelectorAll(".card")].filter(c => {
    const r = c.getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight && !c.matches(":hover");
  });
}
let chaosTimer, flyTimer;
function chaosTick() {
  if (state.chaos && !document.hidden && !lb.open && zoomer.hidden) {
    const cards = visibleCards();
    if (cards.length) fx(pick(cards), pick(FX));
    if (Math.random() < .25) fx(pick([...document.querySelectorAll(".sticker, .tab, .btn")]), pick(["fx-spin", "fx-wiggle", "fx-zoom"]));
  }
  chaosTimer = setTimeout(chaosTick, rand(1400, 3200));
}
function flyTick() {
  if (state.chaos && !document.hidden && !lb.open && zoomer.hidden) {
    const f = document.createElement("div");
    f.className = "flyby"; f.setAttribute("aria-hidden", "true");
    f.style.bottom = `calc(${Math.round(rand(20, 60))}vh)`;
    f.innerHTML = `<img src="images/memes/${pick(MEMES)}.jpg" alt="">`;
    document.body.append(f);
    f.addEventListener("animationend", () => f.remove());
  }
  flyTimer = setTimeout(flyTick, rand(9000, 16000));
}
function setChaos(on) {
  state.chaos = on;
  document.body.classList.toggle("calm", !on);
  const b = $("#chaos"); b.setAttribute("aria-pressed", on); b.textContent = on ? "Chaos mode: ON" : "Chaos mode: OFF";
  try { localStorage.setItem("wl-chaos", on ? "on" : "off"); } catch (e) {}
}
$("#chaos").addEventListener("click", () => setChaos(!state.chaos));

// Snow
(function snow() {
  const cv = $("#snow"), ctx = cv.getContext("2d");
  let W, H, flakes = [];
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(160, W * H / 9000));
    flakes = Array.from({ length: n }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(1, 3.4), s: rand(.3, 1.2), d: rand(0, 6.28) }));
  };
  size(); addEventListener("resize", size);
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
      if (!reduced && state.chaos) {
        f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .4;
        if (f.y > H + 4) { f.y = -4; f.x = rand(0, W); }
      }
    }
    requestAnimationFrame(draw);
  };
  draw();
})();

renderTabs(); render(); setChaos(state.chaos);
if (!reduced) { chaosTimer = setTimeout(chaosTick, 1800); flyTimer = setTimeout(flyTick, 5000); }
</script>
